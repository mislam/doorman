name: doorman

services:
  worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WORKER_HOST: "0.0.0.0"
      WORKER_PORT: "8768"
      HOME: /app
    expose:
      - "8768"
    volumes:
      - ./db:/app/db
      - hf_cache:/app/.cache
      - insightface_models:/app/.insightface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8768/health')",
        ]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3

  enroll:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8768:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    depends_on:
      worker:
        condition: service_healthy

volumes:
  hf_cache:
  insightface_models:
