name: doorface

services:
  worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WORKER_HOST: "0.0.0.0"
      WORKER_PORT: "8768"
    ports:
      - "8768:8768"
    volumes:
      - ./config:/app/config:ro
      - hf_cache:/root/.cache
    # Phase 1: InsightFace models cache under /root/.insightface — extend volumes if needed
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # TODO: enable when /health endpoint exists
    # healthcheck:
    #   test:
    #     [
    #       "CMD",
    #       "python3.11",
    #       "-c",
