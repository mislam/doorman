[project]
name = "doorface-worker"
version = "0.0.0"
requires-python = ">=3.11"
description = "Doorface worker — doorbell face recognition and HA notify"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
line-ending = "auto"
